<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - BloodLink</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #b71c1c;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        h2 {
            color: #b71c1c;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #b71c1c;
            color: white;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #b71c1c;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>BloodLink</h1>
    <p>Donor Dashboard</p>
</header>

<div class="container">

    <h2>Registered Donors</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Blood Group</th>
            <th>City</th>
            <th>Available</th>
        </tr>
        </thead>

        <tbody id="donorTable">
        </tbody>
    </table>

    <a class="back" href="index.html">
        ← Back to Home
    </a>

</div>

<script>

    async function loadDonors() {

        try {
