<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodLink - Record Donation</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #b71c1c;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #b71c1c;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #b71c1c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #8e0000;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #b71c1c;
            text-decoration: none;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>BloodLink</h1>
    <p>Blood Donation Record</p>
</header>

<div class="container">

    <h2>Record Donation</h2>

    <label>Donor ID</label>
    <input
            type="number"
            id="donorId"
            placeholder="Enter donor ID"
    >

    <label>Hospital Name</label>
    <input
            type="text"
            id="hospitalName"
            placeholder="Enter hospital name"
    >

    <label>City</label>
    <input
            type="text"
            id="city"
            placeholder="Enter city"
    >

    <button type="button" onclick="recordDonation()">
        Record Donation
    </button>

    <div id="message"></div>
