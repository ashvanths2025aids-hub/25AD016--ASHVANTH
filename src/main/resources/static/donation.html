<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodLink - Record Donation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #b71c1c;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
        }

        .container {
            width: 90%;
            max-width: 550px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #b71c1c;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #b71c1c;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #b71c1c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #8e0000;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #fff3f3;
            border-left: 4px solid #b71c1c;
            border-radius: 5px;
            font-size: 14px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #b71c1c;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<header>
    <h1>🩸 BloodLink</h1>
    <p>Blood Donor Management System</p>
</header>

<div class="container">

    <div class="card">

        <h2>Record Blood Donation</h2>

        <p class="subtitle">
            Enter the donation details below
        </p>

        <label for="donorId">Donor ID</label>

        <input
                type="number"
                id="donorId"
                placeholder="Enter donor ID"
        >

        <label for="hospitalName">Hospital Name</label>

        <input
                type="text"
                id="hospitalName"
                placeholder="Enter hospital name"
        >

        <label for="city">City</label>

        <input
                type="text"
                id="city"
                placeholder="Enter city"
        >

        <button type="button" onclick="recordDonation()">
            🩸 Record Donation
        </button>

        <div id="message"></div>

        <div class="info">
            <b>Important:</b>
            After donating blood, the donor will be unavailable
            for 90 days.
        </div>

        <a class="back" href="dashboard.html">
            ← Back to Dashboard
        </a>

    </div>

</div>

<script>

    async function recordDonation() {

        const donorId =
            document.getElementById("donorId").value.trim();

        const hospitalName =
            document.getElementById("hospitalName").value.trim();

        const city =
            document.getElementById("city").value.trim();

        const message =
            document.getElementById("message");

        if (donorId === "" ||
            hospitalName === "" ||
            city === "") {

            message.innerText =
                "Please fill all fields.";

            message.style.color = "red";

            return;
        }

        message.innerText =
            "Recording donation...";

        message.style.color = "#b71c1c";

        try {

            const response = await fetch("/api/donations", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    donorId: Number(donorId),

                    hospitalName: hospitalName,

                    city: city
                })
            });

            const result = await response.json();

            if (!response.ok) {

                message.innerText =
                    result.message || "Donation failed.";

                message.style.color = "red";

                return;
            }

            message.innerText =
                "✓ Donation recorded successfully!";

            message.style.color = "green";

            document.getElementById("donorId").value = "";
            document.getElementById("hospitalName").value = "";
            document.getElementById("city").value = "";

        } catch (error) {

            message.innerText =
                "Server connection failed.";

            message.style.color = "red";
        }
    }

</script>

</body>

</html>
