<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodLink</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        header {
            background: #b71c1c;
            color: white;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 40px 20px;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 220px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .card h2 {
            color: #b71c1c;
        }

        button {
            background: #b71c1c;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #8e0000;
        }
    </style>
</head>

<body>

<header>
    <h1>BloodLink</h1>
    <p>Blood Donor Registry and Search</p>
</header>

<div class="container">

    <h2>Welcome to BloodLink</h2>

    <p>
        Find and manage blood donors easily.
    </p>

    <div class="card-container">

        <div class="card">
            <h2>Register Donor</h2>
            <p>Add a new blood donor.</p>
            <button onclick="location.href='donor.html'">
                Register
            </button>
        </div>

        <div class="card">
            <h2>Search Donors</h2>
            <p>Search donors by blood group and city.</p>
            <button onclick="location.href='search.html'">
                Search
            </button>
        </div>

        <div class="card">
            <h2>Dashboard</h2>
            <p>View donor information.</p>
            <button onclick="location.href='dashboard.html'">
                Dashboard
            </button>
        </div>

        <div class="card">
            <h2>Donation</h2>
            <p>Record blood donations.</p>
            <button onclick="location.href='donation.html'">
                Record
            </button>
        </div>

    </div>

</div>

</body>
</html>
