<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLink - Find Donor</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #b71c1c;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        h2 {
            color: #b71c1c;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: #b71c1c;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #8e0000;
        }

        .donor {
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .donor h3 {
            color: #b71c1c;
            margin-top: 0;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #b71c1c;
        }
    </style>
</head>

<body>

<header>
    <h1>BloodLink</h1>
    <p>Search Available Blood Donors</p>
</header>

<div class="container">

    <h2>Find Donor</h2>

    <label for="bloodGroup">Blood Group</label>

    <select id="bloodGroup">
        <option value="">Select Blood Group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
    </select>

    <label for="city">City</label>

    <input
            type="text"
            id="city"
            placeholder="Enter city"
    >

    <button onclick="searchDonors()">
        Search Donor
    </button>

    <div id="message"></div>

    <div id="results"></div>

    <a class="back" href="index.html">
        ← Back to Home
    </a>

</div>

<script>

    async function searchDonors() {

        const bloodGroup =
            document.getElementById("bloodGroup").value;

        const city =
            document.getElementById("city").value.trim();

        const message =
            document.getElementById("message");

        const results =
            document.getElementById("results");

        results.innerHTML = "";

        if (bloodGroup === "" || city === "") {
            message.innerText =
                "Please select blood group and enter city.";
            return;
        }

        message.innerText = "Searching...";

        try {

            const url =
                "/api/donors/search?bloodGroup="
                + encodeURIComponent(bloodGroup)
                + "&city="
                + encodeURIComponent(city);

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error("Search failed");
            }

            const donors = await response.json();

            if (donors.length === 0) {
                message.innerText =
                    "No available donors found.";
                return;
            }

            message.innerText =
                donors.length + " donor(s) found.";

            donors.forEach(function(donor) {

                const div =
                    document.createElement("div");

                div.className = "donor";

                div.innerHTML =
                    "<h3>" + donor.name + "</h3>" +
                    "<p><b>Blood Group:</b> "
                    + donor.bloodGroup + "</p>" +
                    "<p><b>City:</b> "
                    + donor.city + "</p>" +
                    "<p><b>Phone:</b> "
                    + donor.phone + "</p>" +
                    "<p><b>Available:</b> "
                    + (donor.available ? "Yes" : "No")
                    + "</p>";

                results.appendChild(div);
            });

        } catch (error) {

            message.innerText =
                "Unable to search donors. Please check the server.";
        }
    }

</script>

</body>
</html>
